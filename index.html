<!doctype html>

    <meta name="description" content="Mossa Orthopedic Care — solusi prostetik & ortotik berkualitas untuk kembali bergerak dan bebas melangkah. Melayani Sidoarjo dan Jember." />
    <title>Mossa Orthopedic Care — Prostetik & Ortotik Terpercaya</title>

    <!--
      Security headers via <meta> — best-effort untuk static hosting
      (GitHub Pages tidak punya layer server untuk set HTTP response
      header seperti Content-Security-Policy/X-Frame-Options secara
      native). Meta CSP TIDAK sekuat header HTTP asli (mis. tidak bisa
      menegakkan frame-ancestors — itu wajib header, browser abaikan
      kalau lewat meta), tapi tetap mengurangi permukaan serangan XSS
      dengan membatasi domain mana yang boleh dipanggil script/style/
      gambar/koneksi. Kalau situs ini nanti pindah ke hosting yang
      mendukung custom header (Cloudflare Pages, Netlify, Vercel),
      pindahkan aturan ini ke header HTTP asli untuk proteksi penuh
      termasuk clickjacking (frame-ancestors).

      connect-src menyertakan *.supabase.co (REST API) dan
      api.cloudinary.com (upload gambar admin). img-src menyertakan
      res.cloudinary.com (delivery gambar) dan data: (inline SVG/icon).
      frame-src untuk embed Google Maps di halaman Tentang Kami.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://res.cloudinary.com https://*.supabase.co;
        connect-src 'self' https://*.supabase.co https://api.cloudinary.com https://formspree.io;
        frame-src https://www.google.com https://www.youtube.com https://player.vimeo.com https://*.googleusercontent.com https://photos.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self' https://formspree.io;"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Preconnect for faster font + Cloudinary asset loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-qlDOn9V5.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/vendor-BIEdpMaI.js">
    <link rel="modulepreload" crossorigin href="/assets/supabase-B4WnJLNZ.js">
    <link rel="stylesheet" crossorigin href="/assets/index-BJzhym6v.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Pasangan dari public/404.html: mengembalikan URL asli sebelum
         React Router membaca window.location. Tanpa ini, redirect dari
         404.html tidak pernah membawa Anda ke halaman yang benar. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </body>
</html>
